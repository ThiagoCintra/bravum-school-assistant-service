name: "Alexa | verificar autenticacao Amazon (somente leitura)"

# Manual e somente leitura. Nunca executa automaticamente.
on:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: alexa-smapi-auth-readonly
  cancel-in-progress: false

jobs:
  check-amazon-auth:
    name: "Separar conectividade, autenticacao e permissao SMAPI"
    if: ${{ github.ref == 'refs/heads/main' }}
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Preparar Node.js 22 no runner temporario
        uses: actions/setup-node@v4
        with:
          node-version: "22"

      - name: Instalar ASK CLI sem credenciais presentes no ambiente
        shell: bash
        run: |
          set -euo pipefail
          npm install --global ask-cli@latest --ignore-scripts --no-audit --no-fund --loglevel=error >/dev/null
          ask --version

      - name: Testar conexao HTTPS publica (sem tokens)
        shell: bash
        run: |
          set -euo pipefail
          set +x
          probe() {
            local label="$1" url="$2" output status
            output="$(mktemp)"
            # Os testes nao incluem headers de autenticacao, Secrets ou payload.
            if status="$(curl --silent --show-error --ipv4 --connect-timeout 7 --max-time 15 --output /dev/null --write-out '%{http_code}' "$url" 2>"$output")"; then
              echo "HTTPS_${label}=CONECTOU_HTTP_${status}"
            else
              case "$(cat "$output")" in
                *"Could not resolve host"*) echo "HTTPS_${label}=DNS_FALHOU" ;;
                *"SSL certificate"*|*"certificate verify failed"*) echo "HTTPS_${label}=TLS_CERTIFICADO_FALHOU" ;;
                *"timed out"*) echo "HTTPS_${label}=TIMEOUT" ;;
                *"Failed to connect"*|*"Connection refused"*) echo "HTTPS_${label}=CONEXAO_FALHOU" ;;
                *) echo "HTTPS_${label}=FALHA_DE_CONECTIVIDADE" ;;
              esac
            fi
            rm -f "$output"
          }
          probe LWA https://api.amazon.com/auth/o2/token
          probe SMAPI https://api.amazonalexa.com/v1/vendors
          echo "Nota: HTTP 400/401/403/405 sao aceitaveis nos testes sem credenciais; mostram que o HTTPS respondeu."

      - name: Verificar resolucao DNS pelo Node.js (sem Secrets)
        shell: bash
        run: |
          set -euo pipefail
          # Esta etapa nao recebe ASK_REFRESH_TOKEN nem ASK_VENDOR_ID.
          # Verifica Node/libc (dns.lookup) e DNS direto (dns.resolve4),
          # sem requests autenticados nem impressao de enderecos IP.
          node <<'NODE'
          const dns = require('node:dns').promises;
          const targets = [
            ['LWA', 'api.amazon.com'],
            ['SMAPI', 'api.amazonalexa.com']
          ];
          (async () => {
            for (const [label, hostname] of targets) {
              try {
                await dns.lookup(hostname, {family: 4});
                console.log(`NODE_LOOKUP_${label}=OK`);
              } catch (err) {
                const codes = ['ENOTFOUND', 'EAI_AGAIN', 'ETIMEOUT', 'ECONNREFUSED'];
                console.log(`NODE_LOOKUP_${label}=${codes.includes(err.code) ? err.code : 'FALHOU'}`);
              }
              try {
                await dns.resolve4(hostname);
                console.log(`NODE_RESOLVE4_${label}=OK`);
              } catch (err) {
                const codes = ['ENOTFOUND', 'EAI_AGAIN', 'ETIMEOUT', 'ECONNREFUSED', 'ENODATA'];
                console.log(`NODE_RESOLVE4_${label}=${codes.includes(err.code) ? err.code : 'FALHOU'}`);
              }
            }
          })().catch(() => {
            console.log('NODE_DNS=ERRO_INESPERADO');
            process.exitCode = 1;
          });
          NODE

      - name: Validar autorizacao Amazon somente leitura
        shell: bash
        env:
          ASK_REFRESH_TOKEN: ${{ secrets.ASK_REFRESH_TOKEN }}
          ASK_VENDOR_ID: ${{ secrets.ASK_VENDOR_ID }}
          NODE_OPTIONS: "--dns-result-order=ipv4first"
        run: |
          set -euo pipefail
          set +x
          umask 077
          if [[ -z "${ASK_REFRESH_TOKEN}" || -z "${ASK_VENDOR_ID}" ]]; then
            echo "::error::FALHA_CONFIG: falta um dos dois Actions Secrets."
            exit 1
          fi
          WORK="$(mktemp -d)"
          trap 'rm -rf "$WORK"' EXIT

          # Nao exibe logs brutos, urls, nomes, IDs, respostas ou debug.
          categorize() {
            python3 - "$1" "$2" "$3" <<'PY'
          import pathlib, re, sys
          stage, stdout_file, stderr_file = sys.argv[1:]
          raw = (pathlib.Path(stderr_file).read_text(errors="replace") +
                 "\n" + pathlib.Path(stdout_file).read_text(errors="replace")).lower()
          classes = [
              ("TOKEN_OAUTH_INVALIDO", r'invalid_grant|invalid.refresh.token|refresh token.*(expired|invalid)|token refresh error'),
              ("HTTP_401", r'\b401\b|\bunauthoriz(?:ed|ation)\b'),
              ("HTTP_403", r'\b403\b|forbidden|access.denied|not authorized'),
              ("HTTP_400", r'\b400\b|bad.request|invalid_request'),
              ("HTTP_429", r'\b429\b|too many requests'),
              ("HTTP_5XX", r'\b(500|502|503|504)\b|internal server error'),
              ("DNS", r'enotfound|eai_again|getaddrinfo'),
              ("TIMEOUT", r'etimedout|timeout|timed out'),
              ("TLS_CERTIFICADO", r'cert(ificate)?( verification)? failed|unable to verify|self.signed'),
              ("CONEXAO_RESETADA", r'econnreset|socket hang up|connection reset'),
              ("CONEXAO_RECUSADA", r'econnrefused|connection refused'),
              ("ERRO_NETWORK_GENERICO", r'network error|fetch failed'),
              ("COMANDO_CLI", r'unknown command|command not found|invalid option'),
              ("CONFIGURACAO_CLI", r'cli_config|unable to resolve profile|profile.*not found'),
          ]
          category=next((name for name,pattern in classes if re.search(pattern,raw)), "NAO_CLASSIFICADO")
          print(f"DIAGNOSTICO_{stage}={category}")
          if category in ("DNS", "TIMEOUT", "ERRO_NETWORK_GENERICO"):
              # Somente o nome do host, nunca a URL completa nem a mensagem bruta.
              # O filtro nao permite revelar tokens ou subdominios arbitrarios.
              match = re.search(
                  r'getaddrinfo\\s+(?:ENOTFOUND|EAI_AGAIN)\\s+([a-z0-9._-]+)',
                  raw, re.I
              )
              if match:
                  host = match.group(1).lower().rstrip(".")
                  if host in ("undefined", "null", "none", "localhost"):
                      safe_host = "INVALIDO_OU_AUSENTE"
                  elif re.fullmatch(r'[a-z0-9.-]{1,253}', host) and (
                      host == "amazon.com" or host.endswith(".amazon.com") or
                      host == "amazonalexa.com" or host.endswith(".amazonalexa.com")
                  ):
                      safe_host = host
                  else:
                      safe_host = "DOMINIO_NAO_AMAZON_OCULTO"
                  print(f"HOST_FALHA_{stage}={safe_host}")
              else:
                  print(f"HOST_FALHA_{stage}=NAO_IDENTIFICADO")
          PY
          }

          echo "PASSO_1=INICIANDO_GET_VENDOR_LIST"
          if ask smapi get-vendor-list >"$WORK/vendor.out" 2>"$WORK/vendor.err"; then
            echo "PASSO_1=OK_CONSULTA_CONTA_AMAZON"
            python3 - "$WORK/vendor.out" <<'PY'
          import json, os, pathlib, sys
          try:
              payload=json.loads(pathlib.Path(sys.argv[1]).read_text(errors="replace"))
              matched=os.environ["ASK_VENDOR_ID"] in json.dumps(payload)
              print("VENDOR_ID_NA_CONTA=" + ("CONFIRMADO" if matched else "NAO_ENCONTRADO_NA_RESPOSTA"))
          except (ValueError, KeyError, TypeError):
              print("VENDOR_ID_NA_CONTA=FORMATO_INESPERADO")
          PY
          else
            categorize CONTA "$WORK/vendor.out" "$WORK/vendor.err"
            echo "::error::GET_VENDOR_LIST_FALHOU (somente categoria publicada, sem dados da conta)."
            exit 1
          fi

          echo "PASSO_2=INICIANDO_LIST_SKILLS_FOR_VENDOR"
          if ask smapi list-skills-for-vendor >"$WORK/skills.out" 2>"$WORK/skills.err"; then
            echo "PASSO_2=OK_CONSULTA_SKILLS"
            echo "SUCESSO: conexao SMAPI validada (somente leitura)."
          else
            categorize SKILLS "$WORK/skills.out" "$WORK/skills.err"
            echo "::error::LIST_SKILLS_FOR_VENDOR_FALHOU (somente categoria publicada)."
            exit 1
          fi
